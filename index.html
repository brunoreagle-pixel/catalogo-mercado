<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="description" content="Monte sua compra pelo celular e combine a retirada ou entrega com o mercado.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mercado da Vila</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: vitrine de mercado direta ao ponto. Cabeçalho verde com busca e categorias fixas,
   cards em grade de duas colunas no celular e etiqueta amarela de "cartaz de oferta" nos preços promocionais.
   Tema único e claro, definido pela marca. --marca e --apoio são trocadas pela configuração da loja. */
:root {
  --marca: #1E4D38;
  --apoio: #F6B21A;
  --marca-escura: color-mix(in srgb, var(--marca) 78%, #000);
  --marca-suave: color-mix(in srgb, var(--marca) 9%, #fff);
  --apoio-suave: color-mix(in srgb, var(--apoio) 20%, #fff);
  --apoio-tinta: #2E2205;
  --fundo: #F3F6F0;
  --sup: #FFFFFF;
  --tinta: #16221B;
  --tinta-2: #55625A;
  --linha: #DAE2D7;
  --neutro: #ECF0E8;
  --alerta: #AE3A12;
  --alerta-suave: #FBEAE2;
  --ok: #1C7443;
  --whats: #0E7A41;
  --foco: #D97F00;
  --raio: 14px;
  --fonte-titulo: 'Bricolage Grotesque', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --fonte: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--fundo); color: var(--tinta); font-family: var(--fonte); font-size: 16px; line-height: 1.45; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--marca); }
h1, h2, h3, p, ul, ol, dl, dd, figure, fieldset { margin: 0; padding: 0; }
ul, ol { list-style: none; }
fieldset { border: 0; min-width: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: not-allowed; }
a { color: inherit; }
img, svg { display: block; }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; border-radius: 6px; }
.ic { flex: none; }
.so-leitor { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.nota { font-size: 13px; color: var(--tinta-2); }
.largura { width: 100%; max-width: 1180px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Botões */
.bt { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 16px; border-radius: 12px; font-weight: 700; font-size: 15px; text-decoration: none; text-align: center; transition: transform .12s ease, background-color .15s ease; }
.bt:active:not(:disabled) { transform: scale(.98); }
.bt-principal { background: var(--marca); color: #fff; }
.bt-principal:hover:not(:disabled) { background: var(--marca-escura); }
.bt-linha { background: var(--sup); border: 1.5px solid var(--linha); color: var(--tinta); }
.bt-linha:hover:not(:disabled) { border-color: var(--marca); }
.bt-whats { background: var(--whats); color: #fff; }
.bt:disabled, .bt-desligado { opacity: .5; cursor: not-allowed; }
.bt-largo { width: 100%; }
.bt-texto { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; color: var(--marca); font-weight: 700; font-size: 14px; }
.bt-texto:hover { text-decoration: underline; }
.bt-perigo { color: var(--alerta); }
.bt-icone { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; flex: none; color: var(--tinta-2); }
.bt-icone:hover:not(:disabled) { background: var(--neutro); color: var(--tinta); }
.bt-icone:disabled { opacity: .35; }

/* Cabeçalho */
.topo { background: var(--marca); color: #fff; }
.topo-linha { display: flex; align-items: center; gap: 8px; padding-block: 10px 8px; }
.marca { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; color: #fff; }
.logo { width: 44px; height: 44px; border-radius: 12px; flex: none; object-fit: cover; }
.logo-iniciais { display: grid; place-items: center; background: var(--apoio); color: var(--apoio-tinta); font-family: var(--fonte-titulo); font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
.marca-texto { display: grid; min-width: 0; }
.marca-texto strong { font-family: var(--fonte-titulo); font-size: 19px; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
.topo .status { color: rgba(255,255,255,.86); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ponto { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #F2B8A0; }
.status-aberto .ponto { background: #7FE3A6; }
.bt-topo { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 20px; background: rgba(255,255,255,.14); color: #fff; font-size: 13.5px; font-weight: 600; text-decoration: none; flex: none; white-space: nowrap; }
.bt-topo:hover { background: rgba(255,255,255,.24); }
.bt-carrinho-topo { display: none; background: var(--apoio); color: var(--apoio-tinta); font-weight: 700; font-variant-numeric: tabular-nums; }
.bt-carrinho-topo:hover { background: color-mix(in srgb, var(--apoio) 86%, #fff); }
.so-largo { display: none; }

.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--marca); padding-block: 2px 10px; box-shadow: 0 4px 14px rgba(15, 30, 22, .14); }
.barra > .largura { display: grid; gap: 10px; }
.busca { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 6px 0 14px; background: var(--sup); border-radius: 14px; color: var(--tinta-2); }
.busca:focus-within { outline: 3px solid var(--apoio); outline-offset: 1px; }
.busca input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; font-size: 16px; color: var(--tinta); }
.busca input::placeholder { color: var(--tinta-2); }
.busca input::-webkit-search-cancel-button { display: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 38px; padding: 0 14px; border-radius: 19px; font-size: 14px; font-weight: 600; white-space: nowrap; background: var(--sup); border: 1.5px solid var(--linha); color: var(--tinta); }
.chip-ativo { background: var(--marca); border-color: var(--marca); color: #fff; }
.chips .chip { background: rgba(255,255,255,.13); border-color: transparent; color: #fff; }
.chips .chip:hover { background: rgba(255,255,255,.24); }
.chips .chip-oferta { background: var(--apoio); color: var(--apoio-tinta); }
.chips .chip-ativo { background: #fff; color: var(--marca); box-shadow: inset 0 0 0 2px var(--apoio); }

/* Conteúdo */
.conteudo { display: flex; flex-direction: column; gap: 22px; padding-block: 14px 104px; }
.atendimento { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.atend { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--sup); border: 1px solid var(--linha); border-radius: 12px; color: var(--marca); min-height: 56px; }
.atend:hover { border-color: var(--marca); }
.atend > span { display: grid; min-width: 0; }
.atend strong { font-size: 14px; color: var(--tinta); line-height: 1.2; }
.atend span span { font-size: 12.5px; color: var(--tinta-2); line-height: 1.25; }

.banners { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.banners::-webkit-scrollbar { display: none; }
.banner { flex: 0 0 min(78%, 300px); display: flex; align-items: center; gap: 10px; min-height: 86px; padding: 12px 12px 12px 14px; border-radius: 16px; scroll-snap-align: start; background: color-mix(in srgb, var(--cor) 10%, #fff); border: 1px solid color-mix(in srgb, var(--cor) 28%, #fff); color: var(--tinta); }
.banner-hoje { flex-basis: min(88%, 400px); background: var(--cor); border-color: var(--cor); color: #fff; }
.banner-texto { display: grid; gap: 2px; flex: 1; min-width: 0; }
.banner-quando { justify-self: start; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: color-mix(in srgb, var(--cor) 80%, #000); }
.banner-hoje .banner-quando { background: var(--apoio); color: var(--apoio-tinta); padding: 2px 8px; border-radius: 6px; }
.banner strong { font-family: var(--fonte-titulo); font-size: 19px; line-height: 1.15; font-weight: 700; }
.banner-chamada { font-size: 13px; opacity: .9; line-height: 1.25; }
.banner img { width: 62px; height: 62px; border-radius: 12px; object-fit: cover; flex: none; }
.banner-seta { flex: none; opacity: .8; }

.secao { display: grid; gap: 10px; }
.secao-topo, .resultados-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.secao h2, .resultados h2 { font-family: var(--fonte-titulo); font-size: 21px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; text-wrap: balance; }
.grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

/* Card de produto */
.card { display: flex; flex-direction: column; min-width: 0; background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); overflow: hidden; }
.card-foto { position: relative; display: block; width: 100%; }
.card-foto:focus-visible { outline-offset: -3px; }
.foto { width: 100%; max-width: 100%; aspect-ratio: 1; background: var(--neutro); overflow: hidden; }
.foto img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .3s ease; }
.foto-ok img { opacity: 1; }
.foto-ilustrada { background: color-mix(in srgb, var(--cor) 13%, #fff); padding: 9%; }
.embalagem { width: 100%; height: 100%; font-family: var(--fonte); filter: drop-shadow(0 3px 3px rgba(20, 30, 24, .16)); }
.foto-vazia { display: grid; place-content: center; justify-items: center; gap: 4px; color: #8A958C; font-size: 12px; background: repeating-linear-gradient(135deg, var(--neutro) 0 10px, #F4F7F1 10px 20px); }
.selo { position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 8px; font-size: 12.5px; font-weight: 800; line-height: 1.3; font-variant-numeric: tabular-nums; }
.selo-oferta { background: var(--apoio); color: var(--apoio-tinta); transform: rotate(-3deg); box-shadow: 0 1px 0 rgba(0,0,0,.12); }
.selo-indisponivel { background: rgba(22, 34, 27, .86); color: #fff; font-weight: 700; }
.card-indisponivel .foto { filter: grayscale(.85); opacity: .55; }
.card-indisponivel h3, .card-indisponivel .preco { color: var(--tinta-2); }
.card-info { display: grid; gap: 2px; padding: 10px 10px 0; min-width: 0; }
.card-info h3 { font-size: 14.5px; font-weight: 600; line-height: 1.25; min-height: 2.5em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-emb { font-size: 12.5px; color: var(--tinta-2); line-height: 1.3; }
.card-info .card-emb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.preco { display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 1px; min-height: 46px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.preco s { font-size: 12.5px; color: var(--tinta-2); }
.preco-valor { display: inline-flex; align-items: baseline; gap: 2px; }
.preco strong { font-family: var(--fonte-titulo); font-size: 20px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
.preco-un { font-size: 12.5px; font-weight: 600; color: var(--tinta-2); }
.preco-oferta .preco-valor { background: var(--apoio); color: var(--apoio-tinta); padding: 1px 8px 2px; border-radius: 8px; transform: rotate(-1.5deg); transform-origin: left center; }
.preco-oferta .preco-un { color: inherit; opacity: .8; }
.card-acao { padding: 10px; margin-top: auto; }
.card-acao .bt { width: 100%; min-height: 42px; border-radius: 10px; padding: 0 8px; }
.bt-add { background: var(--marca-suave); color: var(--marca); font-variant-numeric: tabular-nums; }
.bt-add:hover { background: color-mix(in srgb, var(--marca) 16%, #fff); }
.qtd { display: flex; align-items: stretch; height: 42px; border-radius: 10px; background: var(--marca); color: #fff; overflow: hidden; }
.qtd button { display: grid; place-items: center; width: 42px; flex: none; color: #fff; }
.qtd button:hover { background: rgba(255,255,255,.16); }
.qtd button:focus-visible { outline-offset: -3px; }
.qtd output { flex: 1; display: grid; place-items: center; min-width: 0; font-weight: 700; font-size: 14.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.qtd-compacta { height: 40px; width: 140px; flex: none; }
.qtd-compacta button { width: 40px; }

/* Kits */
.grade-kits { display: grid; gap: 10px; }
.kit { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 10px; background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); }
.kit-foto { border-radius: 10px; overflow: hidden; align-self: start; }
.kit-info { display: grid; gap: 4px; min-width: 0; }
.kit-info h3 { font-family: var(--fonte-titulo); font-size: 17px; font-weight: 700; line-height: 1.2; }
.kit-itens { font-size: 13px; color: var(--tinta-2); line-height: 1.4; }
.kit-itens li::before { content: "· "; }
.kit-pe { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.kit-pe .preco { min-height: 0; margin: 0; }
.kit-pe .bt { min-height: 42px; border-radius: 10px; }
.kit-pe .qtd { width: 140px; }
.tag-estimado { font-size: 11.5px; font-weight: 600; color: var(--tinta-2); }

/* Resultados */
.resultados { display: grid; gap: 12px; }
.controles { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.alterna { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 12px; border: 1.5px solid var(--linha); border-radius: 21px; background: var(--sup); font-size: 14px; font-weight: 600; cursor: pointer; }
.alterna input { width: 18px; height: 18px; accent-color: var(--marca); }
.alterna-on { border-color: var(--marca); background: var(--marca-suave); }
.ordenar select { min-height: 42px; padding: 0 30px 0 12px; border: 1.5px solid var(--linha); border-radius: 21px; background: var(--sup); font-size: 14px; font-weight: 600; }
.bt-mais { justify-self: center; }
.vazio { display: grid; justify-items: center; gap: 10px; padding: 36px 16px; text-align: center; background: var(--sup); border: 1px dashed var(--linha); border-radius: var(--raio); color: var(--tinta-2); }
.vazio h3 { font-family: var(--fonte-titulo); font-size: 19px; color: var(--tinta); }
.vazio p { max-width: 36ch; font-size: 14.5px; }
.rodape { display: grid; gap: 4px; padding-top: 16px; border-top: 1px solid var(--linha); font-size: 13px; color: var(--tinta-2); }
.link-discreto { font-size: 13px; color: var(--tinta-2); }

/* Barra fixa do carrinho (celular) */
.barra-carrinho { position: fixed; inset: auto 0 0; z-index: 30; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--fundo) 62%, transparent); pointer-events: none; }
.bt-carrinho { pointer-events: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; max-width: 560px; margin-inline: auto; min-height: 54px; padding: 0 16px; border-radius: 16px; background: var(--marca); color: #fff; box-shadow: 0 8px 22px rgba(15, 40, 27, .28); font-variant-numeric: tabular-nums; }
.bt-carrinho:active { transform: scale(.99); }
.bc-qtd { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14.5px; }
.bc-ver { font-size: 14.5px; }
.bc-ver strong { font-family: var(--fonte-titulo); font-size: 17px; }

/* Painéis */
.painel { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(14, 24, 18, .52); animation: surgir .16s ease; }
.painel-caixa { display: flex; flex-direction: column; width: 100%; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); background: var(--fundo); border-radius: 20px 20px 0 0; overflow: hidden; outline: none; animation: subir .22s ease; }
.painel-lateral .painel-caixa { height: 100%; max-height: 100%; border-radius: 0; padding-top: env(safe-area-inset-top, 0px); }
.painel-topo { display: flex; align-items: center; gap: 4px; padding: 10px 8px 10px 16px; background: var(--sup); border-bottom: 1px solid var(--linha); }
.painel-topo h2 { flex: 1; min-width: 0; font-family: var(--fonte-titulo); font-size: 19px; font-weight: 700; line-height: 1.2; }
.painel-topo .bt-icone:first-child { margin-left: -8px; }
.painel-corpo { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.painel-rodape { display: grid; gap: 8px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--sup); border-top: 1px solid var(--linha); }
.painel-rodape .nota:empty { display: none; }
@keyframes surgir { from { opacity: 0; } }
@keyframes subir { from { transform: translateY(24px); opacity: .6; } }
@keyframes entrar { from { transform: translateX(32px); opacity: .6; } }

/* Formulários */
.campo { display: grid; gap: 4px; min-width: 0; align-content: start; }
.campo > label, .rotulo { font-size: 13.5px; font-weight: 600; }
.campo small { font-size: 12.5px; color: var(--tinta-2); }
.campo .erro, .erro { color: var(--alerta); font-weight: 600; }
input[type="text"], input[type="tel"], input[type="search"], input[type="number"], input[type="date"], input[type="time"], input[type="datetime-local"], select, textarea {
  width: 100%; min-height: 46px; padding: 10px 12px; border: 1.5px solid var(--linha); border-radius: 10px; background: var(--sup); font-size: 16px; }
textarea { resize: vertical; line-height: 1.4; }
input[type="color"] { width: 64px; height: 46px; padding: 4px; border: 1.5px solid var(--linha); border-radius: 10px; background: var(--sup); }
input:disabled, select:disabled { background: var(--neutro); color: var(--tinta-2); }
.campo input:focus, .campo select:focus, .campo textarea:focus, .preparo input:focus, .bloco input[type="text"]:focus { outline: none; border-color: var(--marca); box-shadow: 0 0 0 3px color-mix(in srgb, var(--marca) 22%, transparent); }
.campo-erro input, .campo-erro select { border-color: var(--alerta); }
.grade-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.bloco { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--linha); border-radius: 12px; background: var(--sup); }
.bloco legend, .bloco summary { font-weight: 700; font-size: 14.5px; padding: 0 6px; }
.bloco summary { cursor: pointer; padding: 4px 0; }
.bloco-linha { display: flex; align-items: center; justify-content: space-between; font-weight: 600; }
.opcao { display: flex; align-items: center; gap: 10px; min-height: 42px; font-size: 14.5px; cursor: pointer; }
.opcao input { width: 20px; height: 20px; flex: none; accent-color: var(--marca); }
.opcao-pequena { min-height: 36px; font-size: 13.5px; font-weight: 500; }
.chips-peso { display: flex; flex-wrap: wrap; gap: 8px; }
.chips-pequenos .chip { min-height: 34px; padding: 0 11px; font-size: 13px; }

/* Avisos */
.aviso { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 12px; background: var(--apoio-suave); color: var(--apoio-tinta); font-size: 14px; }
.aviso > div { display: grid; gap: 8px; min-width: 0; flex: 1; justify-items: start; }
.aviso ul { display: grid; gap: 4px; list-style: disc; padding-left: 18px; }
.aviso-forte { background: var(--alerta-suave); color: #5F1E08; }
.aviso-info { background: var(--marca-suave); color: var(--tinta); }
.aviso-botoes { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.aviso-demo { font-size: 13px; color: var(--tinta-2); padding: 10px 12px; border: 1px dashed var(--linha); border-radius: 10px; }

/* Ficha do produto e informações da loja */
.ficha, .info, .carrinho, .form, .aba { display: grid; gap: 16px; }
.ficha-foto { width: 100%; max-width: 260px; margin-inline: auto; border-radius: 16px; overflow: hidden; }
.ficha-info { display: grid; gap: 6px; }
.info section { display: grid; gap: 6px; }
.info h3 { display: flex; align-items: center; gap: 6px; font-size: 15px; color: var(--marca); }
.info .status { font-size: 14.5px; font-weight: 700; color: var(--alerta); }
.info .status-aberto { color: var(--ok); }
.info .ponto { background: currentColor; }
.tabela-horarios { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.tabela-horarios th { text-align: left; font-weight: 500; text-transform: capitalize; padding: 6px 8px; }
.tabela-horarios td { text-align: right; padding: 6px 8px; }
.tabela-horarios .hoje th, .tabela-horarios .hoje td { font-weight: 700; background: var(--marca-suave); }
.tabela-horarios .hoje th { border-radius: 8px 0 0 8px; }
.tabela-horarios .hoje td { border-radius: 0 8px 8px 0; }
.lista-simples { display: grid; gap: 4px; list-style: disc; padding-left: 20px; font-size: 14.5px; }

/* Carrinho */
.etapas { display: flex; gap: 6px; font-size: 12.5px; color: var(--tinta-2); }
.etapas li { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; padding-bottom: 8px; border-bottom: 3px solid var(--linha); line-height: 1.2; }
.etapas span { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--linha); font-weight: 700; flex: none; }
.etapas .etapa-atual { color: var(--tinta); font-weight: 700; border-color: var(--marca); }
.etapas .etapa-atual span { background: var(--marca); color: #fff; }
.linhas { display: grid; background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); }
.linha { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 12px; padding: 12px; }
.linha + .linha { border-top: 1px solid var(--linha); }
.linha-foto { width: 60px; height: 60px; border-radius: 10px; overflow: hidden; }
.linha-info { display: grid; gap: 8px; min-width: 0; }
.linha-topo { display: flex; justify-content: space-between; gap: 8px; }
.linha-topo h3 { font-size: 15px; font-weight: 600; line-height: 1.25; }
.linha-topo .bt-icone { margin: -8px -8px 0 0; }
.linha-pe { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.linha-total { font-family: var(--fonte-titulo); font-size: 17.5px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; line-height: 1.1; }
.linha-total small { display: block; font-family: var(--fonte); font-size: 11.5px; font-weight: 600; color: var(--tinta-2); }
.preparo { display: grid; gap: 4px; }
.preparo label { font-size: 12.5px; font-weight: 600; color: var(--tinta-2); }
.preparo input { min-height: 42px; }
.bt-preparo { min-height: 34px; font-size: 13.5px; justify-self: start; }
.totais { display: grid; gap: 6px; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.totais > div { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.totais dd { font-weight: 600; text-align: right; }
.totais .dd-texto { font-weight: 500; color: var(--tinta-2); font-size: 13.5px; }
.totais-desc { color: var(--ok); }
.totais .totais-total { margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--linha); font-family: var(--fonte-titulo); font-size: 19px; font-weight: 700; }
.totais .totais-total dd { font-weight: 800; }
.rodape-total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.rodape-total strong { font-family: var(--fonte-titulo); font-size: 21px; font-weight: 800; }
.segmento { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.segmento button { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 6px 10px; border: 1.5px solid var(--linha); border-radius: 12px; background: var(--sup); font-weight: 600; font-size: 14.5px; text-align: center; line-height: 1.2; }
.segmento .seg-ativo { border-color: var(--marca); background: var(--marca-suave); color: var(--marca); font-weight: 700; box-shadow: inset 0 0 0 1px var(--marca); }
.segmento button:disabled { opacity: .5; }
.cartao-loja { display: grid; gap: 10px; padding: 12px; background: var(--sup); border: 1px solid var(--linha); border-radius: 12px; font-size: 14.5px; }
.cartao-loja p { display: flex; gap: 8px; align-items: flex-start; }
.cartao-loja .ic { color: var(--marca); margin-top: 2px; }
.destaque-aviso { padding: 8px 10px; border-radius: 8px; background: var(--apoio-suave); color: var(--apoio-tinta); font-weight: 700; font-size: 14px; }
.frete-linha { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--marca-suave); font-size: 14.5px; font-variant-numeric: tabular-nums; }
.frete-linha strong { font-family: var(--fonte-titulo); font-size: 18px; text-align: right; }
.frete-pendente strong, .frete-fora strong { font-family: var(--fonte); font-size: 14px; font-weight: 600; color: var(--tinta-2); }
.frete-fora strong { color: var(--alerta); }
.resumo-bloco { display: grid; gap: 8px; padding: 12px; background: var(--sup); border: 1px solid var(--linha); border-radius: 12px; font-size: 14.5px; }
.resumo-bloco h3 { font-family: var(--fonte-titulo); font-size: 16px; }
.resumo-itens { display: grid; font-variant-numeric: tabular-nums; }
.resumo-itens li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--linha); }
.resumo-itens li span:last-child { font-weight: 600; white-space: nowrap; }
.resumo-itens small { color: var(--tinta-2); }
.previa { margin: 0; max-height: 300px; overflow: auto; padding: 12px; border-radius: 10px; background: #EEF3EA; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Administração */
.adm .conteudo { padding-bottom: 48px; gap: 14px; }
.abas { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--linha); scrollbar-width: thin; }
.abas button { flex: none; min-height: 46px; padding: 0 14px; font-size: 14.5px; font-weight: 600; color: var(--tinta-2); border-bottom: 3px solid transparent; white-space: nowrap; }
.abas .aba-ativa { color: var(--marca); border-bottom-color: var(--marca); font-weight: 700; }
.aba { padding-top: 14px; }
.form { max-width: 780px; }
.aba-topo { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.aba-topo .campo, .aba-topo > .nota { flex: 1 1 180px; }
.adm-lista { display: grid; gap: 8px; }
.adm-item { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px 12px; align-items: center; padding: 10px; background: var(--sup); border: 1px solid var(--linha); border-radius: 12px; }
.adm-inativo { opacity: .62; }
.adm-foto { width: 56px; height: 56px; border-radius: 8px; overflow: hidden; }
.adm-cor { width: 56px; height: 56px; border-radius: 10px; }
.adm-info { display: grid; gap: 2px; min-width: 0; font-size: 13px; color: var(--tinta-2); }
.adm-info strong { font-size: 15px; color: var(--tinta); }
.adm-oferta { justify-self: start; padding: 1px 8px; border-radius: 6px; background: var(--apoio-suave); color: var(--apoio-tinta); font-weight: 700; }
.adm-controles { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.adm-controles .bt { min-height: 42px; }
.adm-controles .campo-dinheiro { width: 124px; }
.prefixo { display: flex; align-items: center; border: 1.5px solid var(--linha); border-radius: 10px; background: var(--sup); overflow: hidden; }
.prefixo:focus-within { border-color: var(--marca); box-shadow: 0 0 0 3px color-mix(in srgb, var(--marca) 22%, transparent); }
.prefixo span { padding-left: 10px; font-size: 14px; font-weight: 600; color: var(--tinta-2); }
.prefixo input, .campo .prefixo input:focus { border: 0; box-shadow: none; min-height: 43px; padding-left: 6px; font-variant-numeric: tabular-nums; }
.chave { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; font-size: 14px; font-weight: 600; cursor: pointer; position: relative; }
.chave input { position: absolute; opacity: 0; width: 42px; height: 26px; margin: 0; cursor: pointer; }
.chave-trilho { position: relative; width: 42px; height: 26px; border-radius: 13px; background: #B4BEB2; flex: none; transition: background-color .15s ease; }
.chave-trilho::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s ease; }
.chave-on .chave-trilho { background: var(--marca); }
.chave-on .chave-trilho::after { transform: translateX(16px); }
.chave input:focus-visible + .chave-trilho { outline: 3px solid var(--foco); outline-offset: 2px; }
.chaves, .regra { display: grid; gap: 6px; justify-items: start; }
.regra .campo { width: min(100%, 220px); }
.campo-foto .foto-linha { display: flex; align-items: center; gap: 12px; }
.foto-previa { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 10px; background: var(--neutro); color: #8A958C; overflow: hidden; flex: none; }
.foto-previa img { width: 100%; height: 100%; object-fit: cover; }
.foto-botoes { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.foto-botoes .bt { cursor: pointer; }
.foto-botoes input:focus-visible + *, label.bt:has(+ input:focus-visible) { outline: 3px solid var(--foco); outline-offset: 2px; }
.adm-horarios { display: grid; gap: 8px; }
.adm-horario { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; }
.adm-horario .chave { flex: 1 1 150px; text-transform: capitalize; }
.adm-horario input[type="time"] { width: 118px; flex: none; }
.adm-regioes { display: grid; gap: 10px; }
.adm-regioes li { display: grid; grid-template-columns: minmax(0, 1fr) 124px; gap: 8px 10px; align-items: end; padding-bottom: 10px; border-bottom: 1px dashed var(--linha); }
.adm-categorias li { grid-template-columns: minmax(0, 1fr); }
.adm-mover { display: flex; gap: 4px; }
.gira-cima { display: inline-flex; transform: rotate(-90deg); }
.gira-baixo { display: inline-flex; transform: rotate(90deg); }
.adm-nova { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.adm-nova .campo { flex: 1 1 200px; }
.kit-linha { display: grid; gap: 8px; padding-bottom: 12px; border-bottom: 1px dashed var(--linha); }
.lista-marcar { display: grid; max-height: 240px; overflow-y: auto; }
.rolagem { overflow-x: auto; max-width: 100%; }
.rolagem code { display: block; white-space: nowrap; padding: 8px; background: var(--neutro); border-radius: 8px; font-size: 12.5px; }
.mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; white-space: pre; overflow-x: auto; }
.tabela { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 13.5px; }
.tabela th, .tabela td { padding: 8px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--linha); }
.tabela th { font-size: 12.5px; color: var(--tinta-2); }
.csv-erro td { background: var(--alerta-suave); }
.csv-resultado { display: grid; gap: 12px; justify-items: start; }
.csv-resultado .rolagem { width: 100%; }

/* Telas maiores */
@media (max-width: 339px) {
  .grade, .atendimento { grid-template-columns: minmax(0, 1fr); }
}
@media (min-width: 480px) {
  .so-largo { display: inline; }
}
@media (min-width: 620px) {
  .grade { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .resultados .grade { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .adm-item { grid-template-columns: 56px minmax(0, 1fr) auto; }
  .adm-controles { grid-column: auto; justify-content: flex-end; }
  .adm-regioes li { grid-template-columns: minmax(0, 1fr) 124px auto auto; }
  .adm-categorias li { grid-template-columns: minmax(0, 1fr) auto auto; }
}
@media (min-width: 700px) {
  .painel { align-items: center; padding: 24px; }
  .painel-caixa { width: 560px; max-height: min(86%, 760px); border-radius: 20px; }
  .painel-lateral { justify-content: flex-end; padding: 0; }
  .painel-lateral .painel-caixa { width: 440px; max-height: 100%; border-radius: 0; animation-name: entrar; }
  .grade-kits { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .kit { grid-template-columns: minmax(0, 1fr); align-content: start; }
  .kit-foto { width: 120px; }
  .kit-info { align-content: start; }
}
@media (min-width: 900px) {
  .barra-carrinho { display: none; }
  .bt-carrinho-topo { display: inline-flex; }
  .conteudo { padding-bottom: 40px; gap: 28px; }
  .topo-linha { padding-block: 12px 10px; }
  .barra > .largura { grid-template-columns: minmax(280px, 400px) minmax(0, 1fr); align-items: center; gap: 16px; }
  .chips { margin-inline: 0; padding-inline: 0; flex-wrap: wrap; overflow: visible; }
  .banners { margin-inline: 0; padding-inline: 0; }
}
@media (min-width: 1040px) {
  .grade { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .resultados .grade { grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
